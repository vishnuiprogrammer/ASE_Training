<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Registration Form</title>
</head>
<body>

    <div class="form-container">
        <form >
        <table>
            <tr>
                <th colspan="2">
                    Registration Form
                </th>
            </tr>
            <tr>
                <td>Student Name</td>
                <td><input type="text"  ></td>
            </tr>
            <tr>
                <td>Father's Name</td>
                <td><input type="text"  ></td>
            </tr>
            <tr>
                <td>Mother's Name</td>
                <td><input type="text"  ></td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td><input type="date"  ></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>Male<input type="radio"   value="M">
                Female<input type="radio"  value="F" ></td>
            </tr>
            <tr>
                <td>Email ID</td>
                <td><input type="email"  ></td>
            </tr>
            <tr>
                <td>Address</td>
                <td><textarea   rows="3" ></textarea></td>
            </tr>
            <tr>
                <td>State</td>
                <td><input type="text"  ></td>
            </tr>
            <tr>
                <td>City</td>
                <td><input type="text"  ></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="button" value="Submit"></td>
            </tr>
            
        </table>
        </form>
    </div>
    
</body>
</html>
