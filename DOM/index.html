<!-- Drop target -->
<div id="div1" ondrop="drop(event)" ondragover="allowDrop(event)"></div>

<script>
function allowDrop(ev) {
  ev.preventDefault(); // Required to allow a drop
}

function drag(ev) {
  ev.dataTransfer.setData("text", ev.target.id); // Save the ID
}

function drop(ev) {
  ev.preventDefault();
  const data = ev.dataTransfer.getData("text"); // Get the ID
  ev.target.appendChild(document.getElementById(data)); // Perform event
}
</script>
