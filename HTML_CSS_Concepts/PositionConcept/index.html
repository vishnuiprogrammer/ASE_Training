<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Position Concept Page</title>
</head>
<body>
    <div class="static-box">Static (normal flow)</div>

  <div class="sticky-box">Sticky (sticks on scroll)</div>

  <div class="relative-box">Relative (moved slightly)</div>

  <div class="parent">
    Parent (relative)
    <div class="absolute-box">Absolute (inside parent)</div>
  </div>

  <div class="fixed-box">Fixed (always on screen)</div>
</body>
</html>
